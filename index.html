<!doctype html>
<html lang="en" data-theme="dark" data-wall="aurora" data-accent="blue" data-glass="tinted">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lumen — a team workspace in liquid glass: tasks, calendar, projects, focus and insights." />
    <meta name="theme-color" content="#0a0a0c" />
    <title>Lumen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
    <script>
      // Apply the saved look before first paint so colours never flash.
      (function (d) {
        d.classList.add('js');
        try {
          var l = JSON.parse(localStorage.getItem('lumen:look') || '{}');
          var t = l.theme || 'dark';
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          d.dataset.wall = l.wall || 'aurora';
          d.dataset.accent = l.accent || 'blue';
          d.dataset.glass = l.glass || 'tinted';
          if (l.solid) d.classList.add('is-solid');
        } catch (e) {}
        setTimeout(function () { d.classList.add('failsafe'); }, 4000);
      })(document.documentElement);
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wall" aria-hidden="true"></div>

    <div class="app">
      <aside class="side glass glass--chrome">
        <a class="brand" href="#/home" aria-label="Lumen home">
          <span class="brand__mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M5.5 12h13"/></svg></span>
          <span class="brand__name">Lumen</span>
        </a>
        <nav class="nav" aria-label="Main">
          <div class="nav__track">
            <span class="nav__lens"></span>
            <a class="nav__item" data-route="home" href="#/home"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
            <a class="nav__item" data-route="inbox" href="#/inbox"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg><span>Inbox</span><b class="nav__count" id="count-inbox"></b></a>
            <a class="nav__item" data-route="tasks" href="#/tasks"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></svg><span>Tasks</span><b class="nav__count" id="count-tasks"></b></a>
            <a class="nav__item" data-route="calendar" href="#/calendar"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
            <a class="nav__item" data-route="projects" href="#/projects"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg><span>Projects</span></a>
            <a class="nav__item" data-route="files" href="#/files"><svg class="ico" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></svg><span>Files</span></a>
            <a class="nav__item" data-route="insights" href="#/insights"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></a>
            <a class="nav__item" data-route="team" href="#/team"><svg class="ico" viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 7.5M18 14a6 6 0 0 1 4 7"/></svg><span>People</span></a>
            <a class="nav__item" data-route="settings" href="#/settings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
          </div>
        </nav>
        <div class="side__group">
          <p class="side__label" id="pinned-label">Pinned</p>
          <ul class="pinned" aria-labelledby="pinned-label"></ul>
        </div>
        <button type="button" class="side__status" id="live-status" hidden></button>
        <button type="button" class="side__me" id="btn-me" aria-haspopup="menu" aria-label="Account"></button>
      </aside>

      <header class="toolbar">
        <div class="toolbar__title glass glass--chrome"><span id="compact-title"></span></div>
        <div class="toolbar__tools glass glass--chrome">
          <button type="button" class="search-pill" id="btn-search"><svg class="ico" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg><span>Search</span><kbd>⌘K</kbd></button>
          <button type="button" class="tbtn magnetic" id="btn-new" aria-label="Create" aria-haspopup="menu"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="tbtn magnetic" id="btn-theme" aria-label="Switch theme">
            <svg class="ico ico--sun" viewBox="0 0 24 24"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ico ico--moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button type="button" class="tbtn magnetic" id="btn-bell" aria-label="Notifications" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge-dot" id="bell-badge" hidden></span></button>
          <button type="button" class="tbtn tbtn--me" id="btn-me-top" aria-label="Account" aria-haspopup="menu"></button>
        </div>
      </header>

      <main id="main" class="main">
        <section class="view" data-view="home" hidden></section>
        <section class="view" data-view="inbox" hidden></section>
        <section class="view" data-view="tasks" hidden></section>
        <section class="view" data-view="calendar" hidden></section>
        <section class="view" data-view="projects" hidden></section>
        <section class="view" data-view="files" hidden></section>
        <section class="view" data-view="insights" hidden></section>
        <section class="view" data-view="team" hidden></section>
        <section class="view" data-view="settings" hidden></section>
      </main>

      <nav class="tabbar" aria-label="Main">
        <div class="tabbar__bar glass glass--chrome">
          <div class="tabbar__track">
            <span class="tabbar__lens"></span>
            <a class="tab" data-route="home" href="#/home"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
            <a class="tab" data-route="inbox" href="#/inbox"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg><span>Inbox</span></a>
            <a class="tab" data-route="tasks" href="#/tasks"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></svg><span>Tasks</span></a>
            <a class="tab" data-route="calendar" href="#/calendar"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
                        <button type="button" class="tab" id="tab-more" aria-haspopup="menu"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></button>
          </div>
        </div>
        <button type="button" class="tabbar__search glass glass--chrome" id="btn-search-m" aria-label="Search"><svg class="ico" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg></button>
      </nav>
    </div>

    <button type="button" class="dock-pill glass glass--chrome" id="dock-pill" aria-controls="dock" aria-expanded="false" hidden></button>
    <aside class="dock glass glass--thick" id="dock" aria-label="Claude sessions" hidden>
      <header class="dock__head"><b>Claude sessions</b><button type="button" class="ibtn ibtn--sm" data-close aria-label="Close sessions"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
      <ul class="dock__list"></ul>
    </aside>
    <div class="scrim"></div>
    <div class="pop-layer"></div>

    <div class="island" data-mode="hidden">
      <div class="island__body">
        <button type="button" class="island__compact" aria-label="Open focus timer"></button>
        <div class="island__note" role="status" aria-live="polite"></div>
        <div class="island__full" role="group" aria-label="Focus timer"></div>
      </div>
    </div>

    <dialog class="finder" id="finder" aria-label="Search">
      <div class="finder__bar glass glass--thick">
        <svg class="ico" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg>
        <input id="finder-q" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Search tasks, projects, people…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <ul class="finder__list glass glass--thick" id="finder-list" role="listbox"></ul>
    </dialog>
    <dialog class="modal glass glass--thick" id="modal"></dialog>
    <dialog class="drawer glass glass--thick" id="drawer"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
